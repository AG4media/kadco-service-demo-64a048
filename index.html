<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kadco Service Platform · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0F1A;--ink-2:#121829;--ink-3:#182036;--paper:#FBFAF7;--gold:#C9A96E;--gold-2:#E3C993;--gold-deep:#8E6E3C;--text:#E9ECF3;--muted:#8B93A7;--line:rgba(255,255,255,.08);--green:#3DDC97;--amber:#F5B544;--red:#FF6B6B;--blue:#6EA8FE}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--ink);color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select option{background:#182036}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--ink-2);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));display:grid;place-items:center;font-style:normal;font-weight:700;color:#1B1408;font-size:13px}
.brand b{display:block;font-size:13px;font-weight:600}
.brand span{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:9px 10px;border-radius:8px;font-size:13px;margin-bottom:2px}
.nav button svg{width:16px;height:16px;flex-shrink:0}
.nav button:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav button.on{background:rgba(201,169,110,.14);color:var(--gold-2)}
.nav .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.side .foot{margin-top:auto;font-size:10.5px;color:var(--muted);padding:10px 8px 0;border-top:1px solid var(--line);line-height:1.5}
.side .foot button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 8px;font-size:10.5px;margin-top:8px}
.main{padding:22px 28px 60px;max-width:1240px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:16px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;line-height:1.1}
.sub{color:var(--muted);font-size:12.5px;margin-top:4px}
h3{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.kpi:hover{border-color:rgba(201,169,110,.5)}
.kpi .l{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kpi .v{font-size:24px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.kpi .v small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.kpi .d{font-size:10.5px;margin-top:2px;color:var(--muted)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1.5fr 1fr}.g21{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h4{font-size:12.5px;font-weight:500;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card h4 span{color:var(--muted);font-weight:400;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px 8px 0;border-bottom:1px solid var(--line)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:rgba(255,255,255,.02)}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:500;white-space:nowrap;background:rgba(255,255,255,.06);color:var(--text)}
.pill.g{background:rgba(61,220,151,.14);color:var(--green)}.pill.a{background:rgba(245,181,68,.14);color:var(--amber)}.pill.b{background:rgba(110,168,254,.14);color:var(--blue)}.pill.r{background:rgba(255,107,107,.14);color:var(--red)}.pill.gold{background:rgba(201,169,110,.18);color:var(--gold-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.03)}
.btn:hover{border-color:rgba(255,255,255,.25)}
.btn.p{background:var(--gold);color:#1B1408;border-color:transparent;font-weight:600}
.btn.p:hover{background:var(--gold-2)}
.btn.sm{font-size:11px;padding:4px 9px}
.btn.danger{color:var(--red)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.field{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.field span{color:var(--muted)}.field b{font-weight:500}.field em{font-style:normal;font-size:10.5px;color:var(--green);white-space:nowrap}.field em.w{color:var(--amber)}.field em.r{color:var(--red)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
.form .full{grid-column:1/-1}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}
.alert{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:12px;line-height:1.4}
.alert:first-of-type{border-top:0}
.alert small{display:block;color:var(--muted);font-size:10.5px}
.timeline{list-style:none;font-size:12px}
.timeline li{padding:5px 0 5px 16px;position:relative;border-left:1px solid var(--line)}
.timeline li::before{content:"";position:absolute;left:-4px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.timeline li small{color:var(--muted);display:block;font-size:10.5px}
.status-bar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.status-bar span{font-size:10.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status-bar span.on{background:var(--gold);color:#1B1408;border-color:transparent;font-weight:600}
.status-bar span.done{color:var(--text);border-color:rgba(201,169,110,.5)}
/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.col{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:200px}
.col h5{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.col .where{font-size:10.5px;color:var(--muted);margin:2px 0 10px}
.ticket{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin-bottom:6px;font-size:11.5px}
.ticket b{display:block;font-weight:500}
.ticket small{color:var(--muted);display:block;font-size:10.5px}
.ticket.sel{border-color:var(--gold)}
.col.suggest{border-color:rgba(201,169,110,.6);box-shadow:0 0 0 3px rgba(201,169,110,.12)}
/* phones */
.phones{display:grid;grid-template-columns:360px 360px;gap:24px;align-items:start}
.phone{background:#000;border-radius:34px;padding:12px;width:360px;box-shadow:0 30px 60px rgba(0,0,0,.5);border:1px solid #2a2f3d}
.screen{background:var(--ink-2);border-radius:26px;min-height:640px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.screen .hd{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px}
.screen .hd b{display:block;font-size:13px}
.screen .hd span{color:var(--muted);font-size:10.5px}
.screen .bd{padding:12px 14px;flex:1;overflow:auto;max-height:600px;font-size:12px}
.srow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.srow span{color:var(--muted)}.srow b{font-weight:500;text-align:right}
.big{display:block;width:100%;background:var(--gold);color:#1B1408;font-weight:600;text-align:center;border-radius:10px;padding:10px;margin-top:10px;border:0;font-size:12.5px}
.big:disabled{opacity:.4;cursor:default}
.ghost{display:block;width:100%;border:1px solid var(--line);background:none;color:var(--text);text-align:center;border-radius:10px;padding:8px;margin-top:6px;font-size:12px}
.ev{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.ev button{font-size:11px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text)}
.ev button.done{background:rgba(61,220,151,.14);color:var(--green);border-color:transparent}
.ev button:disabled:not(.done){opacity:.35;cursor:default}
.ev small{color:var(--muted)}
.chk{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:11.5px;align-items:center}
.chk select{padding:3px 6px;font-size:11px;width:auto}
.jobcard{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.jobcard:hover{border-color:var(--gold)}
.jobcard b{display:block}.jobcard small{color:var(--muted);display:block}
/* whatsapp */
.wa{background:#0B141A;border-radius:26px;min-height:640px;display:flex;flex-direction:column;overflow:hidden}
.wa .hd{background:#1F2C34;padding:14px 16px;display:flex;align-items:center;gap:10px;font-size:12px}
.wa .hd i{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold-2),var(--gold-deep));display:grid;place-items:center;color:#1B1408;font-weight:700;font-style:normal}
.wa .hd b{display:block;font-size:13px;color:#E9EDEF}.wa .hd span{color:#8696A0;font-size:10.5px}
.wa .bd{flex:1;padding:12px;overflow:auto;max-height:560px;background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:14px 14px}
.m{background:#1F2C34;color:#E9EDEF;border-radius:9px;padding:8px 10px;margin-bottom:8px;max-width:88%;font-size:12px;line-height:1.45;white-space:pre-line}
.m.me{background:#005C4B;margin-left:auto}
.m .t{display:block;text-align:right;font-size:9.5px;color:#8696A0;margin-top:3px}
.m .act{margin-top:7px;border-top:1px solid rgba(255,255,255,.08);padding-top:6px;text-align:center;color:#53BDEB;font-weight:500;cursor:pointer}
.wa .in{display:flex;gap:8px;padding:10px;background:#1F2C34}
.wa .in input{background:#2A3942;border:0;border-radius:20px;color:#E9EDEF;padding:8px 12px}
.wa .in button{background:#00A884;border:0;border-radius:50%;width:36px;height:36px;color:#fff;font-weight:700}
/* assistant */
.ask{display:flex;gap:8px}
.ask input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted)}
.chips button:hover{color:var(--text);border-color:var(--gold)}
.chat{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.chat .q{align-self:flex-end;background:rgba(201,169,110,.18);color:var(--gold-2);border-radius:10px;padding:8px 12px;max-width:70%;font-size:12.5px}
.chat .a{align-self:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:80%;font-size:12.5px;white-space:pre-line}
.chat .a button{margin-top:8px}
.drawer{position:fixed;right:0;top:0;height:100vh;width:460px;background:var(--ink-2);border-left:1px solid var(--line);box-shadow:-30px 0 60px rgba(0,0,0,.4);padding:20px 22px;overflow:auto;transform:translateX(100%);transition:transform .25s;z-index:20}
.drawer.open{transform:none}
.drawer .x{position:absolute;right:16px;top:14px;background:none;border:0;color:var(--muted);font-size:20px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1B1408;padding:10px 16px;border-radius:10px;font-weight:600;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(201,169,110,.4);border-radius:4px;padding:1px 6px}
.gate{position:fixed;inset:0;background:var(--ink);display:grid;place-items:center;z-index:100;text-align:center;padding:40px}
.gate h1{font-size:36px;margin-bottom:10px}
/* report */
.report{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:11.5px;padding:24px 28px;border-radius:6px;max-width:760px}
.report .rh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1a56a6;padding-bottom:8px;margin-bottom:10px}
.report .rh .lg{font-size:26px;font-weight:700;color:#1a56a6;font-style:italic;letter-spacing:-.02em}
.report .rh small{display:block;color:#444;font-size:9.5px}
.report table{font-size:11px;border:1px solid #333;margin-top:8px}
.report td,.report th{border:1px solid #333;padding:5px 7px;color:#111;vertical-align:top}
.report th{background:#eef2f8;font-size:10px;letter-spacing:0;text-transform:none;color:#111;font-weight:700}
.report .ttl{font-weight:700;font-size:13px;border:1px solid #333;display:inline-block;padding:3px 10px;margin:4px 0}
.report .sig{display:flex;justify-content:space-between;margin-top:14px;font-size:10.5px}
.report .sig div{border-top:1px solid #333;padding-top:6px;width:45%}
.report .ok{color:#0a7a3c;font-weight:700}
@media (max-width:980px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.kpis{grid-template-columns:repeat(3,1fr)}.g2,.g21,.g3{grid-template-columns:1fr}.phones{grid-template-columns:1fr}.drawer{width:100%}}
@media print{.side,.drawer,.toast,.top .btns{display:none}.app{display:block}.main{padding:0}body{background:#fff}}
</style>
</head>
<body>
<div id="gate" class="gate" style="display:none"><div><div class="tag">Kadco Systems · Service platform demo</div><h1 style="margin-top:14px">This demonstration link has expired.</h1><p style="color:var(--muted)">Please contact Automation Gallery for a new link.</p></div></div>
<div class="app">
  <aside class="side">
    <div class="brand"><i>K</i><div><b>Kadco Systems</b><span>Service platform · demo</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Sample data for demonstration. Nothing here is a real customer or engineer.<br><button id="reset">Reset demo data</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="drawer" id="drawer"><button class="x" id="drawerX">×</button><div id="drawerBody"></div></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
